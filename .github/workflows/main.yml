name: Deploy Shopify Extension

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Extension
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy Extension
        # Using npx directly and adding --non-interactive flag
        run: npx shopify app deploy --force --non-interactive
        env:
          SHOPIFY_CLI_TOKEN: ${{ secrets.SHOPIFY_CLI_TOKEN }}
